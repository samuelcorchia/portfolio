server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|ttf|svg|webp)$ {
        expires 1d;
        try_files $uri =404;
    }
    location /docker/ { return 404; }
    location /deploy/ { return 404; }
    location ~* \.(ya?ml|sh|md|json|lock)$ { return 404; }
    location ~ /\. { deny all; }
}
